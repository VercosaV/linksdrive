<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard de Links</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>Meu Dashboard</h1>

<input type="text" id="search" placeholder="Buscar link...">

<button id="addBtn">+ Adicionar</button>

</header>

<main id="linksContainer"></main>

<div id="modal">

<div class="modal-content">

<h2>Novo Link</h2>

<input id="titleInput" placeholder="Nome do site">
<input id="urlInput" placeholder="URL">
<input id="categoryInput" placeholder="Categoria">

<button id="saveLink">Salvar</button>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
