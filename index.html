<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- Firebase v8 (global) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <div class="login-icon"><i class="fa-solid fa-lock"></i></div>
    <h2>Acesso Restrito</h2>
    <p>Digite a senha para acessar o dashboard</p>
    <input type="password" id="loginPassword" placeholder="Senha" autocomplete="off">
    <button id="loginBtn" class="btn-login">Entrar</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display: none;">
  <div class="hdr">
    <div class="hdr-inner">
      <div class="hdr-top">
        <div class="logo">
          <div class="logo-mark"><i class="fa-solid fa-layer-group"></i></div>
          <span>MyDashboard</span>
          <div class="offline-badge" id="offlineBadge">
            <span class="offline-dot"></span>
            <span id="offlineLabel">Cache</span>
          </div>
        </div>
        <div class="hdr-actions">
          <div class="search-wrap" id="searchWrap">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar link…">
          </div>
          <div class="sort-wrap" id="sortWrap">
            <label><i class="fa-solid fa-arrow-up-wide-short"></i></label>
            <select class="sort-select" id="sortSelect">
              <option value="cat_asc">Categoria A→Z</option>
              <option value="cat_desc">Categoria Z→A</option>
              <option value="title_asc">Título A→Z</option>
              <option value="title_desc">Título Z→A</option>
              <option value="date_desc">Mais recentes</option>
              <option value="date_asc">Mais antigos</option>
              <option value="manual">Personalizado ↕</option>
            </select>
          </div>

          <!--
            NOVO: Botão de tamanho dos cards de link.
            Fica visível apenas na view de links (a lógica de hide/show
            está em toggleView() no script.js).
            O id="linkSizeWrap" é usado para ocultar o wrapper inteiro
            quando o usuário muda para a view de notas.
          -->
          <div id="linkSizeWrap">
            <button class="btn btn-ghost" id="linkSizeBtn" title="Tamanho dos cards">
              <i class="fa-solid fa-expand-alt"></i>
              <span>S</span>
            </button>
          </div>

          <button class="btn btn-primary" id="addLinkBtn"><i class="fa-solid fa-plus"></i><span>Link</span></button>
          <button class="btn btn-primary hide" id="addNoteBtn"><i class="fa-solid fa-plus"></i><span>Nota</span></button>
          <button class="btn btn-ghost" id="toggleBtn"><i class="fa-solid fa-pen-to-square"></i><span>Notas</span></button>
          <button class="btn btn-ghost" id="changePasswordBtn"><i class="fa-solid fa-key"></i><span>Alterar Senha</span></button>
          <button class="btn btn-ghost" id="logoutBtn"><i class="fa-solid fa-sign-out-alt"></i><span>Sair</span></button>
        </div>
      </div>
      <div class="cat-scroll" id="catScroll">
        <nav id="catNav" class="cat-tabs"></nav>
      </div>
    </div>
  </div>

  <div class="main">
    <!-- VIEW LINKS -->
    <div id="linksView">
      <div id="linksSkeleton" class="skeleton-grid">
        <div class="skeleton-card"></div><div class="skeleton-card"></div>
        <div class="skeleton-card"></div><div class="skeleton-card"></div>
        <div class="skeleton-card"></div><div class="skeleton-card"></div>
      </div>
      <div id="linksGrid" class="links-grid" style="display:none"></div>
      <div id="linksEmpty" class="empty-state" style="display:none">
        <i class="fa-solid fa-folder-open"></i><p>Nenhum link encontrado.</p>
      </div>
    </div>

    <!-- VIEW NOTAS -->
    <div id="notesView" style="display:none">
      <div class="notes-toolbar">
        <div class="folder-strip" id="folderStrip"></div>
        <button class="btn-new-folder" id="newFolderBtn">
          <i class="fa-solid fa-folder-plus"></i> Nova pasta
        </button>
      </div>
      <div id="notesGrid" class="notes-grid"></div>
      <div id="notesEmpty" class="empty-state" style="display:none">
        <i class="fa-solid fa-note-sticky"></i><p>Nenhuma nota. Clique em "+ Nota" para criar.</p>
      </div>
    </div>
  </div>

  <!-- MODAL: ADICIONAR LINK -->
  <div id="linkModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-hdr">
        <h3><i class="fa-solid fa-link" style="color:var(--accent);margin-right:7px"></i>Adicionar Link</h3>
        <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-row"><label>URL</label><input id="urlInput" type="url" placeholder="https://…"></div>
      <div class="form-row"><label>Nome</label><input id="titleInput" type="text" placeholder="Ex: GitHub"></div>
      <div class="form-row">
        <label>Categoria</label>
        <select id="catSelect"></select>
        <input id="newCatInput" type="text" placeholder="Nome da nova categoria…" style="display:none;margin-top:8px">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">Cancelar</button>
        <button class="btn btn-primary" id="saveLink">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: EDITAR CATEGORIA DO LINK -->
  <div id="editCatModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-hdr">
        <h3><i class="fa-solid fa-tag" style="color:var(--accent);margin-right:7px"></i>Alterar Categoria</h3>
        <button class="modal-close" id="editCatClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-row">
        <label>Nova Categoria</label>
        <select id="editCatSelect"></select>
        <input id="editNewCatInput" type="text" placeholder="Nome da nova categoria…" style="display:none;margin-top:8px">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="editCatCancel">Cancelar</button>
        <button class="btn btn-primary" id="saveEditCat">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: EXPANDIR NOTA (melhorado) -->
  <div id="expandOverlay" class="expand-overlay">
    <div class="expand-box">
      <div class="expand-topbar">
        <div style="display:flex;align-items:center;gap:7px;flex:1;min-width:0">
          <span id="expDots" style="display:flex;gap:4px;flex-shrink:0"></span>
          <input id="expTitle" class="expand-title" type="text" placeholder="Título da nota…">
        </div>
        <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
          <select id="expFolder" class="note-folder-sel" style="max-width:130px"></select>
          <button class="note-btn" id="expandClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <textarea id="expBody" class="expand-body" placeholder="Escreva à vontade…"></textarea>
      <div class="expand-footer">
        <span class="note-ts" id="expTs"></span>
        <span class="note-chars" id="expChars">0 car.</span>
      </div>
    </div>
  </div>

  <!-- MODAL: ALTERAR SENHA -->
  <div id="changePasswordModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-hdr">
        <h3><i class="fa-solid fa-key" style="color:var(--accent);margin-right:7px"></i>Alterar Senha</h3>
        <button class="modal-close" id="changePasswordClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-row">
        <label>Senha Atual</label>
        <input type="password" id="currentPassword" placeholder="Digite sua senha atual">
      </div>
      <div class="form-row">
        <label>Nova Senha</label>
        <input type="password" id="newPassword" placeholder="Nova senha">
      </div>
      <div class="form-row">
        <label>Confirmar Nova Senha</label>
        <input type="password" id="confirmPassword" placeholder="Confirme a nova senha">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="changePasswordCancel">Cancelar</button>
        <button class="btn btn-primary" id="saveNewPassword">Salvar</button>
      </div>
    </div>
  </div>

  <div id="toastWrap" class="toast-wrap"></div>
</div>

<script src="script.js"></script>
</body>
</html>
