<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MyDashboard — MyLinks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOKENS GLOBAIS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root {
  --ml-bg:      #0f172a;
  --ml-item:    #1e293b;
  --ml-hover:   #27354c;
  --ml-text:    #f8fafc;
  --ml-muted:   #94a3b8;
  --ml-accent:  #3b82f6;
  --ml-accent-h:#2563eb;
  --ml-danger:  #ef4444;
  --ml-border:  #334155;
  --ml-shadow:  0 4px 6px -1px rgba(0,0,0,.25), 0 2px 4px -1px rgba(0,0,0,.15);
  --r:          12px;
  --nav-h:      54px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; overflow-x: clip; }

body {
  background: var(--ml-bg);
  color: var(--ml-text);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 5px; }
::-webkit-scrollbar-track { background: var(--ml-bg); }
::-webkit-scrollbar-thumb { background: var(--ml-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--ml-muted); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HEADER STICKY
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.ml-hdr {
  background: rgba(15,23,42,.90);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--ml-border);
  position: sticky;
  top: 0;
  z-index: 200;
}
.ml-hdr-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: .85rem 1.2rem 0;
}

/* Top bar: logo + actions */
.ml-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: .75rem;
  margin-bottom: .85rem;
}

.ml-logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: -.5px;
  color: var(--ml-text);
}
.ml-logo-ico {
  background: var(--ml-accent);
  color: #fff;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: .85rem;
}

.ml-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
}

/* Search */
.ml-srch { position: relative; display: flex; align-items: center; }
.ml-srch i {
  position: absolute;
  left: 10px;
  color: var(--ml-muted);
  font-size: .8rem;
  pointer-events: none;
}
.ml-srch input {
  background: rgba(0,0,0,.22);
  border: 1px solid var(--ml-border);
  color: #fff;
  padding: 7px 9px 7px 32px;
  border-radius: 7px;
  outline: none;
  transition: .2s;
  font-size: .85rem;
  font-family: 'Inter', sans-serif;
  width: 180px;
}
@media(max-width:500px){ .ml-srch input { width: 130px; } }
.ml-srch input:focus {
  border-color: var(--ml-accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,.16);
}

/* Buttons */
.ml-btn {
  border: none;
  padding: 7px 13px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: 600;
  font-size: .83rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: .2s;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
}
.ml-btn-blue  { background: var(--ml-accent); color: #fff; }
.ml-btn-blue:hover  { background: var(--ml-accent-h); transform: translateY(-1px); }
.ml-btn-gray  { background: #64748b; color: #fff; }
.ml-btn-gray:hover  { background: #475569; transform: translateY(-1px); }
@media(max-width:440px){ .ml-btn span { display: none; } }

/* Category tabs */
.ml-nav-scroll { overflow-x: auto; padding-bottom: 9px; }
.ml-nav-tabs   { display: flex; gap: 5px; }
.ml-nav-item {
  background: transparent;
  border: 1px solid transparent;
  color: var(--ml-muted);
  padding: 5px 13px;
  cursor: pointer;
  font-size: .85rem;
  font-weight: 500;
  border-radius: 20px;
  transition: all .18s;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
}
.ml-nav-item:hover { color: var(--ml-text); background: rgba(255,255,255,.05); }
.ml-nav-item.active {
  background: rgba(59,130,246,.15);
  color: var(--ml-accent);
  border-color: rgba(59,130,246,.3);
}
.hide-nav { display: none !important; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MAIN CONTENT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.ml-main {
  padding: 1.2rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   LINKS GRID
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.ml-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 10px;
}
@media(max-width:480px){ .ml-grid { grid-template-columns: 1fr 1fr; } }
@media(max-width:340px){ .ml-grid { grid-template-columns: 1fr; } }

.ml-card {
  background: var(--ml-item);
  border: 1px solid var(--ml-border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all .2s cubic-bezier(.4,0,.2,1);
  cursor: pointer;
  position: relative;
}
.ml-card:hover {
  background: var(--ml-hover);
  border-color: var(--ml-accent);
  transform: translateY(-3px);
  box-shadow: var(--ml-shadow);
}
.ml-card img {
  width: 22px; height: 22px;
  border-radius: 4px;
  object-fit: cover;
  background: #fff;
  padding: 2px;
  flex-shrink: 0;
}
.ml-card span {
  color: var(--ml-text);
  font-size: .85rem;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.ml-del-btn {
  background: transparent;
  color: var(--ml-muted);
  border: none;
  cursor: pointer;
  opacity: 0;
  width: 27px; height: 27px;
  border-radius: 5px;
  transition: .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ml-del-btn:hover { background: rgba(239,68,68,.15); color: var(--ml-danger); }
.ml-card:hover .ml-del-btn { opacity: 1; }
@media(max-width:640px){ .ml-del-btn { opacity: 1; } }

.ml-empty {
  text-align: center;
  color: var(--ml-muted);
  padding: 2.2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
}
.ml-empty i { font-size: 2rem; opacity: .4; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NOTES — toolbar + pastas
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.notes-toolbar {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.folder-strip { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
.ftab {
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--ml-border);
  color: var(--ml-muted);
  padding: 4px 11px;
  border-radius: 20px;
  font-size: .8rem;
  font-weight: 500;
  cursor: pointer;
  transition: all .18s;
  font-family: 'Inter', sans-serif;
}
.ftab:hover { border-color: var(--ml-accent); color: var(--ml-accent); }
.ftab.on {
  background: rgba(59,130,246,.15);
  border-color: rgba(59,130,246,.35);
  color: var(--ml-accent);
}
.ftab .fcnt { font-size: .66rem; opacity: .6; }
.ftab .fdel {
  margin-left: 3px;
  opacity: 0;
  font-size: .68rem;
  transition: opacity .15s;
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  padding: 0 2px;
  line-height: 1;
}
.ftab:hover .fdel { opacity: 1; }
.btn-add-folder {
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 1px dashed var(--ml-border);
  color: var(--ml-muted);
  padding: 4px 11px;
  border-radius: 20px;
  font-size: .78rem;
  cursor: pointer;
  transition: all .18s;
  font-family: 'Inter', sans-serif;
}
.btn-add-folder:hover { border-color: var(--ml-accent); color: var(--ml-accent); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NOTE CARDS — redesenhados
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/*
  EXPLICAÇÃO DO LAYOUT:
  Cada .note-card usa display:flex + flex-direction:column.
  O textarea dentro tem flex:1, o que faz ele PREENCHER todo
  o espaço vertical disponível no card.

  O card tem:
  - min-height: 200px  → altura mínima decente
  - min-width: 200px   → largura mínima
  - resize: both       → handle nativo do browser (canto inferior direito)
  - overflow: hidden   → necessário para o resize funcionar
*/
.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  align-items: start; /* cards não esticam verticalmente entre si */
}

.note-card {
  border-radius: 10px;
  padding: 0;               /* sem padding aqui — usamos no interior */
  min-height: 200px;
  min-width: 200px;
  display: flex;
  flex-direction: column;
  box-shadow: var(--ml-shadow);
  transition: transform .2s, box-shadow .2s;
  position: relative;
  resize: both;             /* ← permite redimensionar com o handle nativo */
  overflow: hidden;         /* necessário para resize funcionar */
}
.note-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
}
.note-card.dragging { opacity: .5; transform: scale(.95); }

/* Cores */
.note-card.c1 { background: #fef08a; color: #1e293b; }
.note-card.c2 { background: #bfdbfe; color: #1e293b; }
.note-card.c3 { background: #bbf7d0; color: #1e293b; }
.note-card.c4 { background: #fed7aa; color: #1e293b; }
.note-card.c5 { background: #f5d0fe; color: #1e293b; }
.note-card.c6 { background: #fecaca; color: #1e293b; }

/* Header da nota */
.note-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px 6px;
  flex-shrink: 0;           /* não deixa o header encolher */
}
.note-ctrl { display: flex; gap: 5px; align-items: center; }

.cdot {
  width: 11px; height: 11px;
  border-radius: 50%;
  cursor: pointer;
  border: 1px solid rgba(0,0,0,.12);
  transition: transform .1s;
  flex-shrink: 0;
}
.cdot:hover { transform: scale(1.4); }

.ndrag {
  cursor: grab;
  padding: 3px;
  color: rgba(0,0,0,.3);
  font-size: .8rem;
}
.ndrag:active { cursor: grabbing; }

/* Botões de ação no header */
.note-actions { display: flex; gap: 3px; align-items: center; }

.ndel, .nexpand {
  background: transparent;
  border: none;
  color: rgba(0,0,0,.35);
  cursor: pointer;
  font-size: .8rem;
  padding: 3px 5px;
  border-radius: 4px;
  transition: .18s;
  line-height: 1;
}
.ndel:hover   { color: #ef4444; background: rgba(239,68,68,.12); }
.nexpand:hover { color: #1e40af; background: rgba(59,130,246,.12); }

/*
  TEXTAREA DENTRO DO CARD:
  - flex:1 faz ele ocupar TODO espaço vertical restante
  - resize:none porque o resize está no card pai
  - min-height:0 para não impedir o card de ser pequeno
  - padding lateral para respirar
*/
.note-card textarea {
  flex: 1;
  min-height: 0;
  background: transparent;
  border: none;
  color: inherit;
  font-size: .9rem;
  line-height: 1.55;
  resize: none;             /* resize no card, não na textarea */
  outline: none;
  font-family: 'Inter', sans-serif;
  padding: 0 12px 6px;
  overflow-y: auto;         /* scroll se o conteúdo exceder o card */
}
.note-card textarea::placeholder { color: rgba(0,0,0,.3); }

/* Footer da nota */
.note-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 12px 9px;
  flex-shrink: 0;
}
.note-ts { font-size: .62rem; color: rgba(0,0,0,.35); }

.note-folder-sel {
  font-size: .67rem;
  background: rgba(0,0,0,.1);
  border: none;
  border-radius: 4px;
  color: rgba(0,0,0,.45);
  padding: 1px 4px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  max-width: 90px;
}
.note-folder-sel:focus { outline: none; }

/* Contador de caracteres */
.note-char-count {
  font-size: .6rem;
  color: rgba(0,0,0,.3);
  padding-right: 4px;
  flex-shrink: 0;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MODAL — ADICIONAR LINK
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.ml-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(4px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  padding: 16px;
}
.ml-modal-box {
  background: var(--ml-bg);
  padding: 20px;
  border-radius: 12px;
  width: 100%;
  max-width: min(390px, calc(100vw - 32px));
  border: 1px solid var(--ml-border);
  box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
  animation: slideUp .22s ease-out;
  font-family: 'Inter', sans-serif;
}
.ml-mhdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.ml-mhdr h3 { font-size: .95rem; color: var(--ml-text); }
.ml-mx { background: transparent; border: none; color: var(--ml-muted); font-size: 1rem; cursor: pointer; }
.ml-mx:hover { color: #fff; }

.ml-ir { margin-bottom: 12px; }
.ml-ir label {
  display: block;
  font-size: .76rem;
  font-weight: 500;
  color: var(--ml-muted);
  margin-bottom: 4px;
}
.ml-ir input, .ml-ir select {
  width: 100%;
  padding: 8px 10px;
  background: var(--ml-item);
  border: 1px solid var(--ml-border);
  color: #fff;
  border-radius: 7px;
  outline: none;
  font-size: max(.86rem, 16px);
  transition: .2s;
  font-family: 'Inter', sans-serif;
}
.ml-ir input:focus, .ml-ir select:focus { border-color: var(--ml-accent); }

.ml-mact {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}
.ml-cancel {
  background: transparent;
  color: var(--ml-muted);
  border: none;
  cursor: pointer;
  padding: 7px 12px;
  font-weight: 500;
  border-radius: 7px;
  transition: .2s;
  font-family: 'Inter', sans-serif;
  font-size: .86rem;
}
.ml-cancel:hover { background: var(--ml-item); color: #fff; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MODAL — EXPANDIR NOTA (tela cheia de edição)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/*
  Por que um modal separado para a nota?
  ─────────────────────────────────────────
  O card tem espaço limitado. Quando o usuário quer escrever
  um texto longo (ex: resumo de aula, lista de tarefas, código),
  ele clica em ⤢ e a nota abre em um modal grande onde a
  textarea ocupa quase a tela inteira. Ao fechar, o conteúdo
  já foi salvo via Firestore (auto-save por debounce).
*/
.note-expand-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(6px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99998;
  padding: 20px;
}
.note-expand-modal.open { display: flex; }

.note-expand-box {
  width: 100%;
  max-width: 760px;
  height: min(80vh, 700px);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 30px 60px -10px rgba(0,0,0,.6);
  animation: slideUp .24s ease-out;
  overflow: hidden;
}

/* Header do modal de nota */
.note-expand-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(0,0,0,.1);
}
.note-expand-ctrl { display: flex; gap: 6px; align-items: center; }
.note-expand-close {
  background: transparent;
  border: none;
  color: rgba(0,0,0,.45);
  cursor: pointer;
  font-size: .95rem;
  padding: 4px 7px;
  border-radius: 5px;
  transition: .18s;
}
.note-expand-close:hover { background: rgba(0,0,0,.1); color: rgba(0,0,0,.7); }

/*
  Textarea do modal expandido:
  - flex:1 ocupa TODO o espaço vertical disponível
  - font-size maior para leitura confortável
  - padding generoso
*/
.note-expand-box textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: inherit;
  font-size: 1rem;
  line-height: 1.65;
  resize: none;
  outline: none;
  font-family: 'Inter', sans-serif;
  padding: 16px 20px;
  overflow-y: auto;
}
.note-expand-box textarea::placeholder { color: rgba(0,0,0,.3); }

/* Footer do modal expandido */
.note-expand-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px 12px;
  flex-shrink: 0;
  border-top: 1px solid rgba(0,0,0,.08);
}
.note-expand-footer .note-ts { font-size: .65rem; color: rgba(0,0,0,.35); }
.note-expand-footer .note-char-count { font-size: .65rem; color: rgba(0,0,0,.35); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOAST
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.toast-wrap {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-width: calc(100vw - 32px);
}
.toast {
  background: var(--ml-item);
  color: #fff;
  padding: 9px 16px;
  border-radius: 8px;
  border-left: 4px solid var(--ml-accent);
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
  font-size: .82rem;
  font-weight: 500;
  animation: slideInR .26s ease-out forwards;
  font-family: 'Inter', sans-serif;
}
.toast.err { border-left-color: var(--ml-danger); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ANIMATIONS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
@keyframes slideUp   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideInR  { from { transform:translateX(110%); opacity:0; } to { transform:translateX(0); opacity:1; } }
@keyframes fadeOut   { to   { opacity:0; transform:translateY(7px); } }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     SCRIPTS — Firebase + MyLinks + Notas
══════════════════════════════════════════ -->
<script type="module">
import { initializeApp }     from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  query, orderBy, onSnapshot, serverTimestamp, updateDoc,
  writeBatch, getDocs
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

/* ── Firebase config ── */
const cfg = {
  apiKey:            "AIzaSyBc3ryOJEFBQlJIUpy835Anej0OulZqHEQ",
  authDomain:        "linksdrive-4012c.firebaseapp.com",
  projectId:         "linksdrive-4012c",
  storageBucket:     "linksdrive-4012c.firebasestorage.app",
  messagingSenderId: "91948654259",
  appId:             "1:91948654259:web:2b596baed6d1ab78cc5ac6"
};
const fbApp    = initializeApp(cfg);
const db       = getFirestore(fbApp);
const linksRef   = collection(db, "links");
const notesRef   = collection(db, "notes");
const foldersRef = collection(db, "note_folders");

/* ── Estado global ── */
let allLinks   = [];
let allNotes   = [];
let allFolders = [];
let isNotes    = false;
let activeCat  = "Todos";
let activeFolder = "all";

// ID da nota atualmente aberta no modal expandido
let expandNoteId = null;

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOAST — exibe mensagens temporárias na tela
   Tipo: 'ok' (borda azul) ou 'err' (borda vermelha)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function toast(msg, type = 'ok') {
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'err' ? ' err' : '');
  t.innerHTML = `<i class="fa-solid ${type==='ok'?'fa-check-circle':'fa-circle-exclamation'}"></i> ${msg}`;
  w.appendChild(t);
  // Remove após 3 s com animação de saída
  setTimeout(() => {
    t.style.animation = 'fadeOut .28s ease-out forwards';
    setTimeout(() => t.remove(), 280);
  }, 3000);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   UTIL — formatar timestamp do Firestore
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function fmtDate(ts) {
  if (!ts) return 'Agora';
  const d = new Date(ts.seconds * 1000);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' })
       + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   LINKS — escuta em tempo real (onSnapshot)
   onSnapshot recebe qualquer mudança no Firestore
   e re-renderiza a UI automaticamente
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function startLinks() {
  onSnapshot(query(linksRef, orderBy("category")), snap => {
    allLinks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCats();
    renderLinks();
  }, () => toast("Erro Firebase", "err"));
}

/* Renderiza as abas de categorias e popula o <select> do modal */
function renderCats() {
  const nav = document.getElementById('ml-catNav');
  const sel = document.getElementById('ml-catSel');
  // Set garante valores únicos; spread + sort ordena alfabeticamente
  const cats = ["Todos", ...new Set(allLinks.map(l => l.category))].sort();

  nav.innerHTML = '';
  sel.innerHTML = '';

  cats.forEach(c => {
    // Aba de navegação
    const b = document.createElement('button');
    b.className = 'ml-nav-item' + (activeCat === c ? ' active' : '');
    b.textContent = c;
    b.onclick = () => { activeCat = c; renderLinks(); renderCats(); };
    nav.appendChild(b);

    // Opção do select (exceto "Todos")
    if (c !== 'Todos') {
      const o = document.createElement('option');
      o.value = c;
      o.textContent = c;
      sel.appendChild(o);
    }
  });
  sel.innerHTML += `<option value="new">+ Nova Categoria…</option>`;
}

/* Renderiza os cards de links filtrando por categoria e busca */
function renderLinks() {
  const G = document.getElementById('ml-linksGrid');
  const E = document.getElementById('ml-linksEmpty');
  const q = document.getElementById('ml-search').value.toLowerCase();
  G.innerHTML = '';

  const fl = allLinks.filter(l =>
    (activeCat === 'Todos' || l.category === activeCat)
    && l.title.toLowerCase().includes(q)
  );

  if (!fl.length) { E.style.display = 'flex'; return; }
  E.style.display = 'none';

  fl.forEach(link => {
    let dom = 'google.com';
    try { dom = new URL(link.url).hostname; } catch {}

    const c = document.createElement('div');
    c.className = 'ml-card';
    // Clique no card abre o link; clique no lixeiro exclui
    c.onclick = e => { if (!e.target.closest('.ml-del-btn')) window.open(link.url, '_blank'); };
    c.innerHTML = `
      <img src="https://www.google.com/s2/favicons?domain=${dom}&sz=64"
           onerror="this.src='https://cdn-icons-png.flaticon.com/512/1006/1006771.png'">
      <span>${link.title}</span>
      <button class="ml-del-btn"><i class="fa-solid fa-trash"></i></button>`;
    c.querySelector('.ml-del-btn').onclick = async e => {
      e.stopPropagation();
      if (confirm(`Excluir "${link.title}"?`))
        try { await deleteDoc(doc(db, 'links', link.id)); toast('Link excluído!'); }
        catch { toast('Erro ao excluir.', 'err'); }
    };
    G.appendChild(c);
  });
}

/* ── Modal de adicionar link ── */
const modal = document.getElementById('ml-modal');
const openM  = () => { modal.style.display = 'flex'; document.getElementById('ml-urlIn').focus(); };
const closeM = () => {
  modal.style.display = 'none';
  ['ml-urlIn','ml-titleIn','ml-newCatIn'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('ml-newCatIn').style.display = 'none';
};

document.getElementById('ml-addBtn').onclick  = openM;
document.getElementById('ml-mclose').onclick  = closeM;
document.getElementById('ml-mcancel').onclick = closeM;
window.addEventListener('click', e => { if (e.target === modal) closeM(); });

// Mostra campo "nova categoria" se o usuário escolher "+ Nova"
document.getElementById('ml-catSel').onchange = e =>
  document.getElementById('ml-newCatIn').style.display = e.target.value === 'new' ? 'block' : 'none';

// Auto-preenche o título com o hostname quando a URL perde o foco
document.getElementById('ml-urlIn').addEventListener('blur', e => {
  const v = e.target.value;
  const ti = document.getElementById('ml-titleIn');
  if (v.length > 8 && ti.value === '') {
    try {
      let h = new URL(v.startsWith('http') ? v : `https://${v}`).hostname;
      let n = h.replace('www.', '').split('.')[0];
      ti.value = n.charAt(0).toUpperCase() + n.slice(1);
    } catch {}
  }
});

// Salvar link no Firestore
document.getElementById('ml-saveLink').onclick = async () => {
  const title = document.getElementById('ml-titleIn').value.trim();
  let url     = document.getElementById('ml-urlIn').value.trim();
  let cat     = document.getElementById('ml-catSel').value;
  if (cat === 'new') cat = document.getElementById('ml-newCatIn').value.trim();

  if (!title || !url || !cat) return toast('Preencha todos os campos!', 'err');
  if (!url.startsWith('http')) url = 'https://' + url;
  if (allLinks.some(l => l.url.toLowerCase() === url.toLowerCase()))
    return toast(`"${title}" já existe!`, 'err');

  const btn = document.getElementById('ml-saveLink');
  btn.textContent = 'Salvando…';
  btn.disabled = true;
  try {
    await addDoc(linksRef, { title, url, category: cat, timestamp: new Date() });
    toast('Link salvo!');
    closeM();
    activeCat = cat;
    renderCats();
    renderLinks();
  } catch { toast('Falha ao salvar.', 'err'); }
  finally { btn.textContent = 'Salvar'; btn.disabled = false; }
};

document.getElementById('ml-search').oninput = renderLinks;

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOGGLE LINKS ↔ NOTAS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const toggleBtn  = document.getElementById('ml-toggleNotes');
const addNoteBtn = document.getElementById('ml-addNoteBtn');
const linksView  = document.getElementById('ml-linksView');
const notesView  = document.getElementById('ml-notesView');
const navScroll  = document.getElementById('ml-navScroll');
const addBtn     = document.getElementById('ml-addBtn');
const srchWrap   = document.getElementById('ml-srchWrap');

toggleBtn.onclick = () => {
  isNotes = !isNotes;
  if (isNotes) {
    linksView.style.display = 'none';
    notesView.style.display  = 'block';
    navScroll.classList.add('hide-nav');
    addBtn.style.display     = 'none';
    addNoteBtn.style.display = 'flex';
    srchWrap.style.display   = 'none';
    toggleBtn.innerHTML = '<i class="fa-solid fa-link"></i><span> Links</span>';
    startNotes();
  } else {
    linksView.style.display  = 'block';
    notesView.style.display  = 'none';
    navScroll.classList.remove('hide-nav');
    addBtn.style.display     = 'flex';
    addNoteBtn.style.display = 'none';
    srchWrap.style.display   = 'flex';
    toggleBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i><span> Notas</span>';
  }
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NOTAS — inicialização
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function startNotes() {
  // Escuta pastas em tempo real
  onSnapshot(query(foldersRef, orderBy("name")), snap => {
    allFolders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFolderTabs();
  });
  // Escuta notas ordenadas por 'order'
  onSnapshot(query(notesRef, orderBy("order", "asc")), snap => {
    allNotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // Se alguma nota não tem 'order', corrige antes de renderizar
    if (allNotes.some(n => n.order === undefined)) fixOrders();
    else renderNotes();
  });
}

/* Corrige notas sem campo 'order' (legado) */
async function fixOrders() {
  for (let i = 0; i < allNotes.length; i++)
    if (allNotes[i].order === undefined)
      await updateDoc(doc(db, 'notes', allNotes[i].id), { order: i });
}

/* Renderiza as abas de pastas */
function renderFolderTabs() {
  const strip = document.getElementById('folder-strip');
  strip.innerHTML = '';

  // Aba "Todas"
  const all = document.createElement('button');
  all.className = 'ftab' + (activeFolder === 'all' ? ' on' : '');
  all.innerHTML = `Todas <span class="fcnt">${allNotes.length}</span>`;
  all.onclick = () => { activeFolder = 'all'; renderFolderTabs(); renderNotes(); };
  strip.appendChild(all);

  // Uma aba por pasta
  allFolders.forEach(f => {
    const cnt = allNotes.filter(n => n.folder === f.id).length;
    const b = document.createElement('button');
    b.className = 'ftab' + (activeFolder === f.id ? ' on' : '');
    b.innerHTML = `<i class="fa-solid fa-folder" style="font-size:.75rem"></i> ${f.name}
      <span class="fcnt">${cnt}</span>
      <button class="fdel" title="Excluir pasta">✕</button>`;
    b.onclick = e => {
      if (e.target.classList.contains('fdel')) return;
      activeFolder = f.id;
      renderFolderTabs();
      renderNotes();
    };
    b.querySelector('.fdel').onclick = async e => {
      e.stopPropagation();
      if (!confirm(`Excluir pasta "${f.name}"? As notas ficam sem pasta.`)) return;
      // Remove a pasta e desvincula as notas
      const batch = writeBatch(db);
      allNotes.filter(n => n.folder === f.id)
              .forEach(n => batch.update(doc(db, 'notes', n.id), { folder: '' }));
      batch.delete(doc(db, 'note_folders', f.id));
      await batch.commit();
      if (activeFolder === f.id) activeFolder = 'all';
    };
    strip.appendChild(b);
  });
}

/* Botão para criar nova pasta */
document.getElementById('btn-add-folder').onclick = async () => {
  const name = prompt('Nome da nova pasta:');
  if (!name || !name.trim()) return;
  await addDoc(foldersRef, { name: name.trim(), created: serverTimestamp() });
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NOTAS — renderizar cards
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function renderNotes() {
  const G = document.getElementById('ml-notesGrid');
  const E = document.getElementById('ml-notesEmpty');
  G.innerHTML = '';

  // Filtra por pasta ativa
  const visible = activeFolder === 'all'
    ? allNotes
    : allNotes.filter(n => n.folder === activeFolder);

  if (!visible.length) { E.style.display = 'flex'; return; }
  E.style.display = 'none';

  visible.forEach((note, idx) => {
    const card = document.createElement('div');
    card.className = `note-card c${note.color || 1}`;
    card.draggable = true;
    card.dataset.id  = note.id;
    card.dataset.idx = idx;

    /*
      Restaurar tamanho salvo:
      O usuário pode redimensionar o card arrastando o handle nativo
      (canto inferior direito). Ao soltar o mouse, salvamos
      width e height no Firestore. Aqui restauramos esse tamanho.
    */
    if (note.width)  card.style.width  = note.width;
    if (note.height) card.style.height = note.height;

    // Opções de pasta para o <select> dentro do card
    const folderOpts = allFolders.map(f =>
      `<option value="${f.id}" ${note.folder === f.id ? 'selected' : ''}>${f.name}</option>`
    ).join('');

    // Contador de caracteres atual
    const charCount = (note.content || '').length;

    card.innerHTML = `
      <div class="note-hdr">
        <div class="note-ctrl">
          <span class="ndrag"><i class="fa-solid fa-grip-vertical"></i></span>
          <span class="cdot" style="background:#fef08a" data-c="1"></span>
          <span class="cdot" style="background:#bfdbfe" data-c="2"></span>
          <span class="cdot" style="background:#bbf7d0" data-c="3"></span>
          <span class="cdot" style="background:#fed7aa" data-c="4"></span>
          <span class="cdot" style="background:#f5d0fe" data-c="5"></span>
          <span class="cdot" style="background:#fecaca" data-c="6"></span>
        </div>
        <div class="note-actions">
          <!-- Botão expandir: abre a nota em modal de tela cheia -->
          <button class="nexpand" title="Expandir para editar">
            <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
          </button>
          <button class="ndel" title="Excluir nota">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>
      <textarea placeholder="Escreva algo…">${note.content || ''}</textarea>
      <div class="note-footer">
        <span class="note-ts">${fmtDate(note.createdAt || note.timestamp)}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="note-char-count">${charCount} car.</span>
          <select class="note-folder-sel">
            <option value="">📁 Sem pasta</option>
            ${folderOpts}
          </select>
        </div>
      </div>`;

    /* ── Drag & Drop ── */
    card.addEventListener('dragstart', onDragStart);
    card.addEventListener('dragover',  onDragOver);
    card.addEventListener('drop',      onDrop);
    card.addEventListener('dragend',   onDragEnd);

    /*
      REDIMENSIONAMENTO:
      O browser fornece o handle nativo via `resize: both` no CSS.
      Quando o usuário solta o mouse após redimensionar, capturamos
      as novas dimensões e salvamos no Firestore.

      Por que mouseup e não resize event?
      O evento `resize` existe no window, não em elementos.
      Para elementos, o ResizeObserver é mais robusto, mas
      mouseup é simples e funciona bem neste contexto.
    */
    const ro = new ResizeObserver(() => {
      // Debounce: espera 400ms após parar de redimensionar para salvar
      clearTimeout(card._resizeTimer);
      card._resizeTimer = setTimeout(() => {
        const w = card.style.width;
        const h = card.style.height;
        if (w !== note.width || h !== note.height) {
          updateDoc(doc(db, 'notes', note.id), { width: w, height: h });
          // Atualiza localmente para evitar saves desnecessários
          note.width  = w;
          note.height = h;
        }
      }, 400);
    });
    ro.observe(card);

    /* ── Troca de cor ── */
    card.querySelectorAll('.cdot').forEach(d =>
      d.onclick = () => updateDoc(doc(db, 'notes', note.id), { color: parseInt(d.dataset.c) })
    );

    /*
      AUTO-SAVE DO CONTEÚDO:
      Usa debounce de 900ms para não disparar um save a cada tecla.
      Também atualiza o contador de caracteres em tempo real.
    */
    const ta = card.querySelector('textarea');
    const charEl = card.querySelector('.note-char-count');
    let saveTimer;
    ta.oninput = () => {
      charEl.textContent = ta.value.length + ' car.';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() =>
        updateDoc(doc(db, 'notes', note.id), { content: ta.value }), 900
      );
      // Se a nota estiver aberta no modal expandido, sincroniza
      if (expandNoteId === note.id) {
        document.getElementById('nexp-ta').value = ta.value;
        document.getElementById('nexp-char').textContent = ta.value.length + ' caracteres';
      }
    };

    /* ── Excluir nota ── */
    card.querySelector('.ndel').onclick = async () => {
      if (confirm('Excluir nota?')) await deleteDoc(doc(db, 'notes', note.id));
    };

    /* ── Mudar pasta ── */
    card.querySelector('.note-folder-sel').onchange = e =>
      updateDoc(doc(db, 'notes', note.id), { folder: e.target.value });

    /*
      BOTÃO EXPANDIR (⤢):
      Abre o modal de edição completa para essa nota.
      Passa o ID e os dados da nota para o modal.
    */
    card.querySelector('.nexpand').onclick = () => openExpandModal(note);

    G.appendChild(card);
  });

  renderFolderTabs();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MODAL EXPANDIR NOTA
   Abre a nota em um modal grande para edição confortável
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function openExpandModal(note) {
  expandNoteId = note.id;
  const m   = document.getElementById('note-expand-modal');
  const box = document.getElementById('note-expand-box');
  const ta  = document.getElementById('nexp-ta');
  const ts  = document.getElementById('nexp-ts');
  const chr = document.getElementById('nexp-char');

  // Aplica a cor do card no modal
  box.className = `note-expand-box c${note.color || 1}`;
  // Estende o estilo diretamente para os elementos internos herdarem a cor
  box.style.background = '';
  const colorMap = {1:'#fef08a',2:'#bfdbfe',3:'#bbf7d0',4:'#fed7aa',5:'#f5d0fe',6:'#fecaca'};
  box.style.background = colorMap[note.color || 1];
  box.style.color = '#1e293b';

  ta.value = note.content || '';
  ts.textContent = fmtDate(note.createdAt || note.timestamp);
  chr.textContent = (note.content || '').length + ' caracteres';

  // Popula os color dots no header do modal
  const dotsWrap = document.getElementById('nexp-dots');
  dotsWrap.innerHTML = '';
  [1,2,3,4,5,6].forEach(c => {
    const d = document.createElement('span');
    d.className = 'cdot';
    d.style.background = colorMap[c];
    d.dataset.c = c;
    d.onclick = () => {
      updateDoc(doc(db, 'notes', note.id), { color: c });
      box.style.background = colorMap[c];
      note.color = c;
    };
    dotsWrap.appendChild(d);
  });

  // Popula o folder select do modal
  const fsel = document.getElementById('nexp-folder');
  fsel.innerHTML = `<option value="">📁 Sem pasta</option>`
    + allFolders.map(f =>
        `<option value="${f.id}" ${note.folder === f.id ? 'selected' : ''}>${f.name}</option>`
      ).join('');
  fsel.onchange = e => updateDoc(doc(db, 'notes', note.id), { folder: e.target.value });

  // Auto-save no modal expandido (debounce 900ms)
  let expandSaveTimer;
  ta.oninput = () => {
    chr.textContent = ta.value.length + ' caracteres';
    clearTimeout(expandSaveTimer);
    expandSaveTimer = setTimeout(() => {
      updateDoc(doc(db, 'notes', note.id), { content: ta.value });
      // Sincroniza com o card se estiver visível
      const card = document.querySelector(`.note-card[data-id="${note.id}"]`);
      if (card) {
        const cardTa = card.querySelector('textarea');
        const cardCh = card.querySelector('.note-char-count');
        if (cardTa) cardTa.value = ta.value;
        if (cardCh) cardCh.textContent = ta.value.length + ' car.';
      }
    }, 900);
  };

  m.classList.add('open');
  ta.focus();
}

/* Fecha o modal expandido */
function closeExpandModal() {
  document.getElementById('note-expand-modal').classList.remove('open');
  expandNoteId = null;
}

document.getElementById('note-expand-close').onclick = closeExpandModal;
// Fecha clicando no backdrop
document.getElementById('note-expand-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('note-expand-modal')) closeExpandModal();
});

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DRAG & DROP das notas
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let dragSrc = null;

function onDragStart(e) { this.classList.add('dragging'); dragSrc = this; e.dataTransfer.effectAllowed = 'move'; }
function onDragOver(e)  { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
function onDrop(e)      { e.stopPropagation(); if (dragSrc !== this) reorder(dragSrc.dataset.id, this.dataset.id); return false; }
function onDragEnd()    { this.classList.remove('dragging'); }

/*
  Reordenar notas:
  1. Encontra os índices de origem e destino em allNotes
  2. Remove do array e insere na nova posição (splice)
  3. Salva apenas o range afetado (otimização: não salva tudo)
*/
async function reorder(srcId, tgtId) {
  const si = allNotes.findIndex(n => n.id === srcId);
  const ti = allNotes.findIndex(n => n.id === tgtId);
  if (si < 0 || ti < 0) return;

  const arr = [...allNotes];
  const [rm] = arr.splice(si, 1);
  arr.splice(ti, 0, rm);

  const s = Math.min(si, ti), e = Math.max(si, ti);
  await Promise.all(
    Array.from({ length: e - s + 1 }, (_, i) =>
      updateDoc(doc(db, 'notes', arr[s + i].id), { order: s + i })
    )
  );
}

/* ── Adicionar nova nota ── */
addNoteBtn.onclick = async () => {
  await addDoc(notesRef, {
    content:   '',
    color:     Math.floor(Math.random() * 6) + 1,
    order:     allNotes.length,
    folder:    activeFolder === 'all' ? '' : activeFolder,
    createdAt: serverTimestamp(),
    timestamp: serverTimestamp()
  });
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HELPERS DE CONSOLE (utilitários globais)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
window.importarLinksEmLote = async arr => {
  let ok = 0, nok = 0;
  for (const l of arr) {
    if (allLinks.some(x => x.url.toLowerCase() === l.url.toLowerCase())) { nok++; continue; }
    try { await addDoc(linksRef, { ...l, timestamp: new Date() }); ok++; }
    catch { nok++; }
  }
  alert(`Importação: ✅ ${ok}  ❌ ${nok}`);
};

window.removerDuplicatas = async () => {
  const seen = new Set(); let n = 0;
  for (const l of allLinks) {
    if (seen.has(l.url)) { await deleteDoc(doc(db, 'links', l.id)); n++; }
    else seen.add(l.url);
  }
  alert(`${n} duplicatas removidas.`);
};

/* ── Inicializa ── */
startLinks();
</script>
