<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLinks Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i> MyLinks
            </div>
            <div class="search-container">
                <input type="text" id="search" placeholder="Filtrar links...">
                <button id="addBtn" class="btn-new">+ Novo</button>
            </div>
        </div>
        
        <div class="nav-scroll">
            <nav id="categoryNav" class="nav-tabs"></nav>
        </div>
    </header>

    <main id="linksContainer" class="grid"></main>

    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Adicionar Novo Link</h3>
            
            <div class="input-row">
                <label>URL</label>
                <input id="urlInput" placeholder="https://...">
            </div>
            
            <div class="input-row">
                <label>Nome</label>
                <input id="titleInput" placeholder="Ex: GitHub">
            </div>
            
            <div class="input-row">
                <label>Categoria</label>
                <select id="categorySelect"></select>
                <input id="newCategoryInput" placeholder="Nome da categoria..." style="display:none; margin-top:5px;">
            </div>

            <div class="modal-actions">
                <button id="closeModal" class="btn-cancel">Cancelar</button>
                <button id="saveLink" class="btn-new">Salvar no Firebase</button>
            </div>
        </div>
    </div>  
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <script type="module" src="script.js"></script>
</body>
</html>
