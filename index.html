<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- Firebase v8 (global) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <!-- todo o seu HTML permanece igual -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <div class="login-icon"><i class="fa-solid fa-lock"></i></div>
      <h2>Acesso Restrito</h2>
      <p>Digite a senha para acessar o dashboard</p>
      <input type="password" id="loginPassword" placeholder="Senha" autocomplete="off">
      <button id="loginBtn" class="btn-login">Entrar</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <div id="dashboard" style="display: none;">
    <!-- todo o resto do seu dashboard -->
    <!-- mantenha exatamente como estava antes -->
  </div>

  <script src="script.js"></script>
</body>
</html>
