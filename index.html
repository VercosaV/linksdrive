<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLinks Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <div class="top-bar">
                <div class="logo">
                    <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
                    <span>MyLinks</span>
                </div>
                <div class="search-container">
                    <i class="fa-solid fa-search search-icon"></i>
                    <input type="text" id="search" placeholder="Buscar links...">
                    <button id="addBtn" class="btn-new"><i class="fa-solid fa-plus"></i> Novo Link</button>
                    <button id="addNoteBtn" class="btn-new" style="display: none;"><i class="fa-solid fa-plus"></i> Nova Nota</button>
                    <button id="toggleNotesBtn" class="btn-notes"><i class="fa-solid fa-pen-to-square"></i> Notas</button>
                </div>
            </div>
            
            <div class="nav-scroll">
                <nav id="categoryNav" class="nav-tabs"></nav>
            </div>
        </div>
    </header>

    <main>
        <div id="linksView">
            <div id="linksContainer" class="grid"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fa-solid fa-folder-open"></i>
                <p>Nenhum link encontrado nesta categoria.</p>
            </div>
        </div>

        <div id="notesView" style="display: none;">
            <div id="notesContainer" class="grid"></div>
            <div id="emptyNotesState" class="empty-state" style="display: none;">
                <i class="fa-solid fa-note-sticky"></i>
                <p>Nenhuma nota criada hoje.</p>
            </div>
        </div>
    </main>

    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Adicionar Novo Link</h3>
                <button id="closeModalIcon" class="btn-close-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="input-row">
                <label>URL do site</label>
                <input id="urlInput" type="url" placeholder="https://exemplo.com">
            </div>
            
            <div class="input-row">
                <label>Nome do Link</label>
                <input id="titleInput" type="text" placeholder="Ex: GitHub">
            </div>
            
            <div class="input-row">
                <label>Categoria</label>
                <select id="categorySelect"></select>
                <input id="newCategoryInput" type="text" placeholder="Digite o nome da nova categoria..." style="display:none; margin-top:8px;">
            </div>

            <div class="modal-actions">
                <button id="closeModal" class="btn-cancel">Cancelar</button>
                <button id="saveLink" class="btn-new">Salvar</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
