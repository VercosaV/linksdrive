<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-system.css">
  <!-- Firebase v8 (global) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
</head>

<body>

  <!-- TELA DE LOGIN -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <div class="login-icon"><i class="fa-solid fa-layer-group"></i></div>
      <h2>Acesso ao LinksDrive</h2>
      <p>Entre com sua conta do Google ou E-mail</p>
      
      <button id="googleLoginBtn" class="btn-login btn-google" style="background:#ffffff; color:#333; border:1px solid #ccc; display:flex; align-items:center; justify-content:center; gap:10px; font-weight:600; width:100%; cursor:pointer;">
        <i class="fa-brands fa-google" style="color:#4285F4;"></i> Entrar com Google
      </button>

      <div style="margin: 15px 0; text-align: center; border-bottom: 1px solid var(--border); line-height: 0.1em;">
        <span style="background:#fff; padding:0 10px; color:var(--tx3); font-size:0.8rem;">ou e-mail</span>
      </div>

      <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username" style="margin-bottom:10px; width:100%;">
      <input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password" style="width:100%;">
      
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button id="loginBtn" class="btn-login" style="flex:1;">Entrar</button>
        <button id="registerBtn" class="btn-ghost" style="flex:1; border:1px solid var(--border); padding:8px; border-radius:8px; font-weight:600;">Criar Conta</button>
      </div>

      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display: none;">
    <div class="hdr">
      <div class="hdr-inner">
        <div class="hdr-top">
          <div class="logo">
            <div class="logo-mark"><i class="fa-solid fa-layer-group"></i></div>
            <span>MyDashboard</span>
            <div class="offline-badge" id="offlineBadge">
              <span class="offline-dot"></span>
              <span id="offlineLabel">Cache</span>
            </div>
          </div>
          <div class="hdr-actions">
            <div class="search-wrap" id="searchWrap">
              <i class="fa-solid fa-search"></i>
              <input type="text" id="searchInput" placeholder="Buscar link… (Ctrl+K)">
            </div>
            <div class="sort-wrap" id="sortWrap">
              <label><i class="fa-solid fa-arrow-up-wide-short"></i></label>
              <select class="sort-select" id="sortSelect">
                <option value="title_asc">Título A→Z</option>
              </select>
            </div>

            <!-- Tamanho dos cards -->
            <div id="linkSizeWrap">
              <button class="btn btn-ghost" id="linkSizeBtn" title="Tamanho dos cards">
                <i class="fa-solid fa-expand-alt"></i>
                <span>S</span>
              </button>
            </div>

            <!-- Tamanho dos grupos -->
            <div id="groupSizeWrap">
              <button class="btn btn-ghost" id="groupSizeBtn" title="Tamanho dos grupos">
                <i class="fa-solid fa-th-large"></i>
                <span>S</span>
              </button>
            </div>

            <div id="exportWrap">
              <button class="btn btn-ghost" id="exportLinksBtn" title="Exportar links como JSON + TXT">
                <i class="fa-solid fa-file-export"></i>
                <span>Exportar</span>
              </button>
            </div>

            <button class="btn btn-primary" id="addLinkBtn"><i class="fa-solid fa-plus"></i><span>Link</span></button>
            <button class="btn btn-primary hide" id="addNoteBtn"><i class="fa-solid fa-plus"></i><span>Nota</span></button>
            <button class="btn btn-ghost" id="toggleBtn"><i class="fa-solid fa-pen-to-square"></i><span>Notas</span></button>
            <button class="btn btn-ghost" id="themeBtn" title="Personalizar tema">
              <i class="fa-solid fa-palette"></i>
              <span>Tema</span></button>
            <button class="btn btn-ghost" id="logoutBtn"><i class="fa-solid fa-sign-out-alt"></i><span>Sair</span></button>
          </div>
        </div>
        <div class="cat-scroll" id="catScroll">
          <nav id="catNav" class="cat-tabs"></nav>
        </div>
      </div>
    </div>

    <div class="main">
      <!-- VIEW LINKS -->
      <div id="linksView">
        <div id="linksSkeleton" class="skeleton-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
        <div id="linksGrid" class="links-grid" style="display:none"></div>
        <div id="linksEmpty" class="empty-state" style="display:none">
          <i class="fa-solid fa-folder-open"></i>
          <p>Nenhum link encontrado.</p>
        </div>
      </div>

      <!-- VIEW GRUPOS -->
      <div id="groupsView" style="display:none">
        <div id="groupsGrid" class="groups-grid"></div>
        <div id="groupsEmpty" class="empty-state" style="display:none">
          <i class="fa-solid fa-folder-open"></i>
          <p>Nenhum grupo encontrado.</p>
        </div>
        <div id="groupLinksView" style="display:none">
          <div class="group-header">
            <button id="backToGroupsBtn" class="btn btn-ghost">
              <i class="fa-solid fa-arrow-left"></i> Voltar aos Grupos
            </button>
            <h2 id="currentGroupTitle"></h2>
          </div>
          <div id="groupLinksGrid" class="links-grid"></div>
        </div>
      </div>

      <!-- VIEW NOTAS -->
      <div id="notesView" style="display:none">
        <div class="notes-toolbar">
          <div class="folder-strip" id="folderStrip"></div>
          <button class="btn-new-folder" id="newFolderBtn">
            <i class="fa-solid fa-folder-plus"></i> Nova pasta
          </button>
        </div>
        <div id="notesGrid" class="notes-grid"></div>
        <div id="notesEmpty" class="empty-state" style="display:none">
          <i class="fa-solid fa-note-sticky"></i>
          <p>Nenhuma nota. Clique em "+ Nota" para criar.</p>
        </div>
      </div>
    </div>

    <!-- MODAIS E COMPONENTES -->
    <div id="linkModal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-hdr">
          <h3><i class="fa-solid fa-link" style="color:var(--accent);margin-right:7px"></i>Adicionar Link</h3>
          <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="form-row"><label>URL</label><input id="urlInput" type="url" placeholder="https://…"></div>
        <div class="form-row"><label>Nome</label><input id="titleInput" type="text" placeholder="Ex: GitHub"></div>
        <div class="form-row">
          <label>Categoria</label>
          <select id="catSelect"></select>
          <input id="newCatInput" type="text" placeholder="Nome da nova categoria…" style="display:none;margin-top:8px">
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancel">Cancelar</button>
          <button class="btn btn-primary" id="saveLink">Salvar</button>
        </div>
      </div>
    </div>

    <div id="toastWrap" class="toast-wrap"></div>
  </div>

  <script src="extensions.js"></script>
  <script src="script.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado:', reg.scope))
          .catch(err => console.error('Erro no Service Worker:', err));
      });
    }
  </script>
</body>

</html>
