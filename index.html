<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MyDashboard — MyLinks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════ */
:root {
  /* Cores base */
  --bg:        #080c14;
  --bg2:       #0d1421;
  --surface:   #111827;
  --surface2:  #1a2333;
  --border:    #1e2d42;
  --border2:   #253447;

  /* Texto */
  --tx:        #e8edf5;
  --tx2:       #8496b0;
  --tx3:       #4d6080;

  /* Accent */
  --accent:    #3b82f6;
  --accent2:   #2563eb;
  --accent-glow: rgba(59,130,246,.18);

  /* Status */
  --danger:    #ef4444;
  --success:   #22c55e;
  --warn:      #f59e0b;

  /* Notas */
  --n1: #fef9c3; --n1d: #78350f;
  --n2: #dbeafe; --n2d: #1e3a5f;
  --n3: #dcfce7; --n3d: #14532d;
  --n4: #ffedd5; --n4d: #7c2d12;
  --n5: #f3e8ff; --n5d: #4a1d96;
  --n6: #ffe4e6; --n6d: #881337;

  /* Layout */
  --r:    10px;
  --r2:   14px;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
  --shadow2: 0 8px 40px rgba(0,0,0,.55);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; overflow-x: hidden; }

body {
  background: var(--bg);
  color: var(--tx);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  min-height: 100vh;
  /* grade sutil no fundo */
  background-image:
    linear-gradient(rgba(59,130,246,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,.03) 1px, transparent 1px);
  background-size: 40px 40px;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--tx3); }

/* ═══════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════ */
.hdr {
  background: rgba(8,12,20,.88);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 300;
}
.hdr-inner {
  max-width: 1500px;
  margin: 0 auto;
  padding: .9rem 1.4rem 0;
}
.hdr-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: .75rem;
  margin-bottom: .9rem;
}

/* Logo */
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: -.4px;
  color: var(--tx);
  text-decoration: none;
}
.logo-mark {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem;
  box-shadow: 0 0 14px rgba(59,130,246,.5);
}

/* Barra de ações */
.hdr-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Search */
.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.search-wrap i {
  position: absolute;
  left: 11px;
  color: var(--tx3);
  font-size: .78rem;
  pointer-events: none;
}
.search-wrap input {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--tx);
  padding: 7px 10px 7px 32px;
  border-radius: 8px;
  outline: none;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .83rem;
  width: 190px;
  transition: .2s;
}
.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
@media(max-width:500px){ .search-wrap input { width: 130px; } }

/* Sort select */
.sort-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sort-wrap label {
  font-size: .75rem;
  color: var(--tx3);
  white-space: nowrap;
}
.sort-select {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--tx2);
  padding: 6px 10px;
  border-radius: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .8rem;
  outline: none;
  cursor: pointer;
  transition: .2s;
}
.sort-select:focus { border-color: var(--accent); }

/* Botões */
.btn {
  border: none;
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: .82rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: .18s;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 0 10px rgba(59,130,246,.35); }
.btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
.btn-ghost  { background: var(--surface2); color: var(--tx2); border: 1px solid var(--border); }
.btn-ghost:hover  { background: var(--surface); color: var(--tx); transform: translateY(-1px); }
@media(max-width:450px){ .btn span { display: none; } }

/* Tabs de categoria */
.cat-scroll { overflow-x: auto; padding-bottom: 8px; }
.cat-tabs { display: flex; gap: 4px; }
.cat-tab {
  background: transparent;
  border: 1px solid transparent;
  color: var(--tx3);
  padding: 5px 14px;
  border-radius: 20px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .82rem;
  font-weight: 500;
  cursor: pointer;
  transition: .18s;
  white-space: nowrap;
}
.cat-tab:hover { color: var(--tx); background: rgba(255,255,255,.04); }
.cat-tab.active {
  background: var(--accent-glow);
  color: var(--accent);
  border-color: rgba(59,130,246,.35);
}
.cat-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(59,130,246,.15);
  color: var(--accent);
  font-size: .65rem;
  font-weight: 700;
  margin-left: 4px;
}
.hide { display: none !important; }

/* ═══════════════════════════════════════════════
   MAIN
═══════════════════════════════════════════════ */
.main {
  max-width: 1500px;
  margin: 0 auto;
  padding: 1.2rem 1.4rem;
}

/* ═══════════════════════════════════════════════
   LINKS GRID
═══════════════════════════════════════════════ */
.links-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 9px;
}
@media(max-width:480px){ .links-grid { grid-template-columns: 1fr 1fr; gap: 7px; } }

.link-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 10px 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all .2s cubic-bezier(.4,0,.2,1);
  position: relative;
  overflow: hidden;
}
/* barra colorida esquerda ao hover */
.link-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  transform: scaleY(0);
  transition: transform .2s;
  border-radius: 2px 0 0 2px;
}
.link-card:hover::before { transform: scaleY(1); }
.link-card:hover {
  background: var(--surface2);
  border-color: rgba(59,130,246,.3);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.link-card img {
  width: 22px; height: 22px;
  border-radius: 5px;
  object-fit: cover;
  background: #fff;
  padding: 2px;
  flex-shrink: 0;
}
.link-title {
  color: var(--tx);
  font-size: .84rem;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.link-cat-badge {
  font-size: .62rem;
  color: var(--tx3);
  background: var(--bg2);
  border-radius: 4px;
  padding: 1px 5px;
  white-space: nowrap;
  flex-shrink: 0;
}
.link-del {
  background: transparent;
  border: none;
  color: var(--tx3);
  cursor: pointer;
  width: 26px; height: 26px;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: .18s;
  flex-shrink: 0;
  font-size: .75rem;
}
.link-del:hover { background: rgba(239,68,68,.14); color: var(--danger); }
.link-card:hover .link-del { opacity: 1; }
@media(max-width:640px){ .link-del { opacity: 1; } }

.empty-state {
  text-align: center;
  color: var(--tx3);
  padding: 3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.empty-state i { font-size: 2.2rem; opacity: .35; }
.empty-state p { font-size: .9rem; }

/* ═══════════════════════════════════════════════
   NOTES VIEW
═══════════════════════════════════════════════ */

/* Toolbar de pastas */
.notes-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.folder-strip { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }

.ftab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 13px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.03);
  color: var(--tx3);
  font-size: .8rem;
  font-weight: 500;
  font-family: 'Space Grotesk', sans-serif;
  cursor: pointer;
  transition: .18s;
  position: relative;
}
.ftab:hover { border-color: var(--accent); color: var(--accent); }
.ftab.on {
  background: var(--accent-glow);
  border-color: rgba(59,130,246,.4);
  color: var(--accent);
}
.ftab-count {
  font-size: .64rem;
  opacity: .6;
}
.ftab-del {
  margin-left: 2px;
  font-size: .65rem;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  opacity: 0;
  transition: .15s;
  padding: 0 2px;
  line-height: 1;
}
.ftab:hover .ftab-del { opacity: .7; }
.ftab-del:hover { opacity: 1 !important; color: var(--danger) !important; }

.btn-new-folder {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px dashed var(--border2);
  background: transparent;
  color: var(--tx3);
  font-size: .78rem;
  font-family: 'Space Grotesk', sans-serif;
  cursor: pointer;
  transition: .18s;
}
.btn-new-folder:hover { border-color: var(--accent); color: var(--accent); }

/* Grid das notas */
.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 14px;
  align-items: start;
}

/* ──────────────────────────────────────
   NOTE CARD — redesenhado
   Estrutura:
   ┌──────────────────┐
   │ .note-topbar     │  cor, drag, ações
   │ .note-title-wrap │  input de título editável
   │ textarea         │  conteúdo (flex:1)
   │ .note-footer     │  pasta + timestamp + chars
   └──────────────────┘
────────────────────────────────────── */
.note-card {
  border-radius: var(--r2);
  min-height: 220px;
  min-width: 200px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 2px 12px rgba(0,0,0,.18);
  transition: transform .2s, box-shadow .2s;
  position: relative;
  /*
    resize:both + overflow:hidden = handle nativo do browser
    no canto inferior direito para redimensionar o card.
    Isso é puro CSS, sem JS para detecção de resize no drag.
  */
  resize: both;
  overflow: hidden;
}
.note-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 32px rgba(0,0,0,.28);
}
.note-card.dragging { opacity: .45; transform: scale(.96) rotate(1.5deg); }

/* Cores das notas */
.nc1 { background: var(--n1); color: #1c1917; }
.nc2 { background: var(--n2); color: #0f172a; }
.nc3 { background: var(--n3); color: #052e16; }
.nc4 { background: var(--n4); color: #1c0a00; }
.nc5 { background: var(--n5); color: #1e0635; }
.nc6 { background: var(--n6); color: #1c0a0a; }

/* Topbar da nota */
.note-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 11px 5px;
  flex-shrink: 0;
}
.note-topbar-left {
  display: flex;
  align-items: center;
  gap: 5px;
}
.note-topbar-right {
  display: flex;
  align-items: center;
  gap: 3px;
}

/* Handle de drag */
.note-drag {
  cursor: grab;
  color: rgba(0,0,0,.25);
  font-size: .78rem;
  padding: 2px 4px;
  border-radius: 4px;
  transition: .15s;
}
.note-drag:hover { color: rgba(0,0,0,.5); background: rgba(0,0,0,.07); }
.note-drag:active { cursor: grabbing; }

/* Dots de cor */
.cdot {
  width: 11px; height: 11px;
  border-radius: 50%;
  cursor: pointer;
  border: 1.5px solid rgba(0,0,0,.12);
  transition: transform .12s;
  flex-shrink: 0;
}
.cdot:hover { transform: scale(1.45); }

/* Botões de ação na topbar */
.note-act-btn {
  background: transparent;
  border: none;
  color: rgba(0,0,0,.3);
  cursor: pointer;
  width: 26px; height: 26px;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: .75rem;
  transition: .15s;
}
.note-act-btn:hover { color: rgba(0,0,0,.65); background: rgba(0,0,0,.09); }
.note-act-btn.danger:hover { color: #ef4444; background: rgba(239,68,68,.12); }

/* Input de título da nota */
.note-title-wrap {
  padding: 2px 12px 4px;
  flex-shrink: 0;
}
.note-title-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid transparent;
  color: inherit;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  outline: none;
  padding: 2px 0;
  transition: border-color .18s;
  letter-spacing: -.2px;
}
.note-title-input::placeholder { color: rgba(0,0,0,.25); font-weight: 500; }
.note-title-input:focus { border-bottom-color: rgba(0,0,0,.25); }

/* Textarea do conteúdo */
.note-body {
  flex: 1;
  min-height: 0;
  background: transparent;
  border: none;
  color: inherit;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .87rem;
  line-height: 1.58;
  resize: none;
  outline: none;
  padding: 0 12px 6px;
  overflow-y: auto;
}
.note-body::placeholder { color: rgba(0,0,0,.25); }

/* Footer da nota */
.note-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 11px 9px;
  flex-shrink: 0;
  gap: 6px;
}
.note-ts {
  font-size: .6rem;
  color: rgba(0,0,0,.3);
  white-space: nowrap;
  flex-shrink: 0;
}
.note-folder-sel {
  font-size: .67rem;
  background: rgba(0,0,0,.08);
  border: none;
  border-radius: 5px;
  color: rgba(0,0,0,.4);
  padding: 2px 5px;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  max-width: 100px;
  flex-shrink: 0;
}
.note-folder-sel:focus { outline: none; }
.note-chars {
  font-size: .6rem;
  color: rgba(0,0,0,.28);
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════
   MODAL EXPANDIR NOTA
═══════════════════════════════════════════════ */
/*
  Por que um modal expandido?
  O card tem tamanho limitado. Para textos longos (resumos,
  código, listas extensas), o usuário clica em ⤢ e a nota
  abre em um modal onde a textarea ocupa quase toda a tela.
  O auto-save (debounce 900ms) continua funcionando aqui.
*/
.expand-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(8px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99998;
  padding: 20px;
}
.expand-overlay.open { display: flex; }

.expand-box {
  width: 100%;
  max-width: 780px;
  height: min(82vh, 700px);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 40px 80px rgba(0,0,0,.65);
  animation: slideUp .22s ease-out;
  overflow: hidden;
}

.expand-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(0,0,0,.1);
}
.expand-title {
  width: 100%;
  background: transparent;
  border: none;
  color: inherit;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  outline: none;
  margin-right: 10px;
}
.expand-title::placeholder { color: rgba(0,0,0,.3); }

.expand-body {
  flex: 1;
  background: transparent;
  border: none;
  color: inherit;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .97rem;
  line-height: 1.68;
  resize: none;
  outline: none;
  padding: 16px 22px;
  overflow-y: auto;
}
.expand-body::placeholder { color: rgba(0,0,0,.3); }

.expand-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px 12px;
  flex-shrink: 0;
  border-top: 1px solid rgba(0,0,0,.08);
  gap: 10px;
}
.expand-footer .note-ts { font-size: .65rem; }
.expand-footer .note-chars { font-size: .65rem; }

/* ═══════════════════════════════════════════════
   MODAL ADICIONAR LINK
═══════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(6px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  padding: 16px;
}
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r2);
  padding: 22px;
  width: 100%;
  max-width: min(400px, calc(100vw - 32px));
  box-shadow: var(--shadow2);
  animation: slideUp .22s ease-out;
}
.modal-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.modal-hdr h3 { font-size: .95rem; font-weight: 700; color: var(--tx); }
.modal-close {
  background: transparent;
  border: none;
  color: var(--tx3);
  font-size: 1rem;
  cursor: pointer;
  transition: .15s;
}
.modal-close:hover { color: var(--tx); }

.form-row { margin-bottom: 13px; }
.form-row label {
  display: block;
  font-size: .75rem;
  font-weight: 600;
  color: var(--tx3);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.form-row input, .form-row select {
  width: 100%;
  padding: 9px 11px;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--tx);
  border-radius: 8px;
  outline: none;
  font-family: 'Space Grotesk', sans-serif;
  font-size: max(.86rem, 16px);
  transition: .18s;
}
.form-row input:focus, .form-row select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}
.btn-cancel {
  background: transparent;
  border: none;
  color: var(--tx3);
  font-family: 'Space Grotesk', sans-serif;
  font-size: .85rem;
  font-weight: 500;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 7px;
  transition: .15s;
}
.btn-cancel:hover { background: var(--surface2); color: var(--tx); }

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
.toast-wrap {
  position: fixed;
  bottom: 18px;
  right: 18px;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: calc(100vw - 36px);
}
.toast {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--tx);
  padding: 9px 16px;
  border-radius: 9px;
  border-left: 4px solid var(--accent);
  box-shadow: var(--shadow);
  font-size: .82rem;
  font-weight: 500;
  animation: slideInR .24s ease-out forwards;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.err { border-left-color: var(--danger); }
.toast.ok  { border-left-color: var(--success); }

/* ═══════════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════════ */
@keyframes slideUp   { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideInR  { from { opacity:0; transform:translateX(110%); } to { opacity:1; transform:translateX(0); } }
@keyframes fadeOut   { to   { opacity:0; transform:translateY(8px); } }
</style>
</head>

<!-- ════════════════════════════════════
     SCRIPT — Firebase + App
════════════════════════════════════ -->
<script type="module">
import { initializeApp }     from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  query, orderBy, onSnapshot, serverTimestamp, updateDoc,
  writeBatch, getDocs
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

/* ── Config Firebase ── */
const cfg = {
  apiKey:            "AIzaSyBc3ryOJEFBQlJIUpy835Anej0OulZqHEQ",
  authDomain:        "linksdrive-4012c.firebaseapp.com",
  projectId:         "linksdrive-4012c",
  storageBucket:     "linksdrive-4012c.firebasestorage.app",
  messagingSenderId: "91948654259",
  appId:             "1:91948654259:web:2b596baed6d1ab78cc5ac6"
};
const fbApp    = initializeApp(cfg);
const db       = getFirestore(fbApp);
const linksRef   = collection(db, "links");
const notesRef   = collection(db, "notes");
const foldersRef = collection(db, "note_folders");

/* ── Estado global ── */
let allLinks   = [];
let allNotes   = [];
let allFolders = [];
let isNotes       = false;
let activeCat     = "Todos";
let activeFolder  = "all";
let expandNoteId  = null;
let currentSort   = "cat_asc";

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOAST
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/*
  Exibe mensagens temporárias no canto inferior direito.
  type: 'ok' → borda verde | 'err' → borda vermelha | padrão → azul
  Desaparece automaticamente após 3 s com animação fadeOut.
*/
function toast(msg, type = '') {
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  const icon = type === 'err'
    ? 'fa-circle-exclamation'
    : type === 'ok' ? 'fa-check-circle' : 'fa-circle-info';
  t.innerHTML = `<i class="fa-solid ${icon}"></i> ${msg}`;
  w.appendChild(t);
  setTimeout(() => {
    t.style.animation = 'fadeOut .28s forwards';
    setTimeout(() => t.remove(), 280);
  }, 3000);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   UTIL — formatar timestamp Firestore
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/*
  Converte o Timestamp do Firestore (objeto com .seconds)
  em string legível no formato DD/MM/AA HH:MM.
*/
function fmtDate(ts) {
  if (!ts) return 'Agora';
  const d = new Date(ts.seconds * 1000);
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' })
       + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   LINKS — escuta em tempo real
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/*
  onSnapshot: o Firestore envia atualizações em tempo real.
  Cada vez que um doc é adicionado/editado/removido,
  a callback dispara novamente e re-renderizamos.
  Ordenamos por "category" no servidor para reduzir tráfego.
*/
function startLinks() {
  onSnapshot(query(linksRef, orderBy("category")), snap => {
    allLinks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCats();
    renderLinks();
  }, () => toast("Erro Firebase — verifique a conexão.", "err"));
}

/* ─── Ordenação local dos links ─── */
/*
  O Firestore não suporta ordenação por múltiplos critérios mistos
  facilmente sem índices. Fazemos a ordenação no cliente (JS) depois
  de receber os dados, o que é suficiente para uma lista pessoal.
  currentSort é um valor do <select id="sortSelect">.
*/
function sortLinks(list) {
  const arr = [...list];
  switch (currentSort) {
    case 'cat_asc':   return arr.sort((a,b) => a.category.localeCompare(b.category));
    case 'cat_desc':  return arr.sort((a,b) => b.category.localeCompare(a.category));
    case 'title_asc': return arr.sort((a,b) => a.title.localeCompare(b.title));
    case 'title_desc':return arr.sort((a,b) => b.title.localeCompare(a.title));
    case 'date_desc': return arr.sort((a,b) => {
      const ta = a.timestamp?.seconds || 0;
      const tb = b.timestamp?.seconds || 0;
      return tb - ta;
    });
    case 'date_asc': return arr.sort((a,b) => {
      const ta = a.timestamp?.seconds || 0;
      const tb = b.timestamp?.seconds || 0;
      return ta - tb;
    });
    default: return arr;
  }
}

/* Renderiza abas de categoria */
function renderCats() {
  const nav = document.getElementById('catNav');
  const sel = document.getElementById('catSelect');
  /*
    new Set() remove duplicatas.
    spread + sort ordena alfabeticamente.
    "Todos" fica sempre primeiro.
  */
  const cats = ["Todos", ...new Set(allLinks.map(l => l.category))].sort((a, b) =>
    a === 'Todos' ? -1 : b === 'Todos' ? 1 : a.localeCompare(b)
  );

  nav.innerHTML = '';
  sel.innerHTML = '';

  cats.forEach(c => {
    const count = c === 'Todos' ? allLinks.length : allLinks.filter(l => l.category === c).length;
    const b = document.createElement('button');
    b.className = 'cat-tab' + (activeCat === c ? ' active' : '');
    b.innerHTML = `${c}<span class="cat-count">${count}</span>`;
    b.onclick = () => { activeCat = c; renderLinks(); renderCats(); };
    nav.appendChild(b);

    if (c !== 'Todos') {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    }
  });
  sel.innerHTML += `<option value="new">＋ Nova Categoria…</option>`;
}

/* Renderiza cards de link */
function renderLinks() {
  const G = document.getElementById('linksGrid');
  const E = document.getElementById('linksEmpty');
  const q = document.getElementById('searchInput').value.toLowerCase();
  G.innerHTML = '';

  // Filtra por categoria e busca, depois ordena
  let fl = allLinks.filter(l =>
    (activeCat === 'Todos' || l.category === activeCat)
    && (l.title.toLowerCase().includes(q) || l.category.toLowerCase().includes(q))
  );
  fl = sortLinks(fl);

  if (!fl.length) { E.style.display = 'flex'; return; }
  E.style.display = 'none';

  fl.forEach(link => {
    let dom = 'google.com';
    try { dom = new URL(link.url).hostname; } catch {}

    const c = document.createElement('div');
    c.className = 'link-card';
    /*
      e.target.closest('.link-del') → verifica se o clique
      foi no botão de deletar antes de abrir o link.
      Isso evita abrir a URL ao tentar deletar.
    */
    c.onclick = e => { if (!e.target.closest('.link-del')) window.open(link.url, '_blank'); };
    c.innerHTML = `
      <img src="https://www.google.com/s2/favicons?domain=${dom}&sz=64"
           onerror="this.src='https://cdn-icons-png.flaticon.com/512/1006/1006771.png'">
      <span class="link-title">${link.title}</span>
      ${activeCat === 'Todos' ? `<span class="link-cat-badge">${link.category}</span>` : ''}
      <button class="link-del" title="Excluir link"><i class="fa-solid fa-trash"></i></button>`;
    c.querySelector('.link-del').onclick = async e => {
      e.stopPropagation();
      if (confirm(`Excluir "${link.title}"?`))
        try { await deleteDoc(doc(db,'links',link.id)); toast('Link excluído!','ok'); }
        catch { toast('Erro ao excluir.','err'); }
    };
    G.appendChild(c);
  });
}

/* ─── Listener de ordenação ─── */
document.getElementById('sortSelect').onchange = e => {
  currentSort = e.target.value;
  renderLinks();
};

/* ── Modal de adicionar link ── */
const linkModal = document.getElementById('linkModal');
const openModal  = () => { linkModal.style.display = 'flex'; document.getElementById('urlInput').focus(); };
const closeModal = () => {
  linkModal.style.display = 'none';
  ['urlInput','titleInput','newCatInput'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('newCatInput').style.display = 'none';
};

document.getElementById('addLinkBtn').onclick = openModal;
document.getElementById('modalClose').onclick  = closeModal;
document.getElementById('modalCancel').onclick = closeModal;
window.addEventListener('click', e => { if (e.target === linkModal) closeModal(); });

document.getElementById('catSelect').onchange = e =>
  document.getElementById('newCatInput').style.display = e.target.value === 'new' ? 'block' : 'none';

/* Auto-preenche título com hostname quando URL perde o foco */
document.getElementById('urlInput').addEventListener('blur', e => {
  const v = e.target.value;
  const ti = document.getElementById('titleInput');
  if (v.length > 8 && ti.value === '') {
    try {
      let h = new URL(v.startsWith('http') ? v : `https://${v}`).hostname;
      let n = h.replace('www.','').split('.')[0];
      ti.value = n.charAt(0).toUpperCase() + n.slice(1);
    } catch {}
  }
});

/* Salvar link */
document.getElementById('saveLink').onclick = async () => {
  const title = document.getElementById('titleInput').value.trim();
  let   url   = document.getElementById('urlInput').value.trim();
  let   cat   = document.getElementById('catSelect').value;
  if (cat === 'new') cat = document.getElementById('newCatInput').value.trim();

  if (!title || !url || !cat) return toast('Preencha todos os campos!','err');
  if (!url.startsWith('http')) url = 'https://' + url;
  if (allLinks.some(l => l.url.toLowerCase() === url.toLowerCase()))
    return toast(`"${title}" já existe!`,'err');

  const btn = document.getElementById('saveLink');
  btn.textContent = 'Salvando…'; btn.disabled = true;
  try {
    await addDoc(linksRef, { title, url, category: cat, timestamp: new Date() });
    toast('Link salvo!','ok');
    closeModal();
    activeCat = cat;
    renderCats(); renderLinks();
  } catch { toast('Falha ao salvar.','err'); }
  finally { btn.textContent = 'Salvar'; btn.disabled = false; }
};

document.getElementById('searchInput').oninput = renderLinks;

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOGGLE LINKS ↔ NOTAS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const toggleBtn  = document.getElementById('toggleBtn');
const addNoteBtn = document.getElementById('addNoteBtn');
const linksView  = document.getElementById('linksView');
const notesView  = document.getElementById('notesView');
const catScroll  = document.getElementById('catScroll');
const addLinkBtn = document.getElementById('addLinkBtn');
const searchWrap = document.getElementById('searchWrap');
const sortWrap   = document.getElementById('sortWrap');

toggleBtn.onclick = () => {
  isNotes = !isNotes;
  if (isNotes) {
    linksView.style.display  = 'none';
    notesView.style.display  = 'block';
    catScroll.classList.add('hide');
    addLinkBtn.classList.add('hide');
    searchWrap.classList.add('hide');
    sortWrap.classList.add('hide');
    addNoteBtn.classList.remove('hide');
    toggleBtn.innerHTML = '<i class="fa-solid fa-link"></i><span> Links</span>';
    startNotes();
  } else {
    linksView.style.display  = 'block';
    notesView.style.display  = 'none';
    catScroll.classList.remove('hide');
    addLinkBtn.classList.remove('hide');
    searchWrap.classList.remove('hide');
    sortWrap.classList.remove('hide');
    addNoteBtn.classList.add('hide');
    toggleBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i><span> Notas</span>';
  }
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NOTAS — escuta em tempo real
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let notesStarted = false;

function startNotes() {
  /*
    Evita registrar dois onSnapshot para a mesma coleção
    quando o usuário alterna entre Links e Notas várias vezes.
    onSnapshot já é um listener contínuo — basta registrar uma vez.
  */
  if (notesStarted) { renderNotes(); return; }
  notesStarted = true;

  onSnapshot(query(foldersRef, orderBy("name")), snap => {
    allFolders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFolderTabs();
  });

  onSnapshot(query(notesRef, orderBy("order","asc")), snap => {
    allNotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (allNotes.some(n => n.order === undefined)) fixOrders();
    else renderNotes();
  });
}

/* Corrige notas sem campo 'order' (dados legados) */
async function fixOrders() {
  for (let i = 0; i < allNotes.length; i++)
    if (allNotes[i].order === undefined)
      await updateDoc(doc(db,'notes',allNotes[i].id), { order: i });
}

/* ─── Renderizar abas de pasta ─── */
/*
  Cada pasta vira uma aba clicável.
  .ftab-del aparece ao hover da aba para excluir a pasta.
  Ao excluir: batch remove a pasta e desvincula suas notas.
*/
function renderFolderTabs() {
  const strip = document.getElementById('folderStrip');
  strip.innerHTML = '';

  // Aba "Todas"
  const all = document.createElement('button');
  all.className = 'ftab' + (activeFolder === 'all' ? ' on' : '');
  all.innerHTML = `Todas <span class="ftab-count">${allNotes.length}</span>`;
  all.onclick = () => { activeFolder = 'all'; renderFolderTabs(); renderNotes(); };
  strip.appendChild(all);

  allFolders.forEach(f => {
    const cnt = allNotes.filter(n => n.folder === f.id).length;
    const b = document.createElement('button');
    b.className = 'ftab' + (activeFolder === f.id ? ' on' : '');
    b.innerHTML = `<i class="fa-solid fa-folder" style="font-size:.72rem"></i>
      ${f.name}
      <span class="ftab-count">${cnt}</span>
      <button class="ftab-del" title="Excluir pasta">✕</button>`;

    b.onclick = e => {
      if (e.target.classList.contains('ftab-del')) return;
      activeFolder = f.id;
      renderFolderTabs();
      renderNotes();
    };

    b.querySelector('.ftab-del').onclick = async e => {
      e.stopPropagation();
      if (!confirm(`Excluir pasta "${f.name}"? As notas ficam sem pasta.`)) return;
      /*
        writeBatch: agrupa múltiplas escritas Firestore em uma
        única transação atômica. Evita estados inconsistentes
        onde a pasta foi deletada mas as notas ainda apontam para ela.
      */
      const batch = writeBatch(db);
      allNotes.filter(n => n.folder === f.id)
              .forEach(n => batch.update(doc(db,'notes',n.id), { folder: '' }));
      batch.delete(doc(db,'note_folders',f.id));
      await batch.commit();
      if (activeFolder === f.id) activeFolder = 'all';
    };
    strip.appendChild(b);
  });
}

/* Botão "Nova pasta" */
document.getElementById('newFolderBtn').onclick = async () => {
  const name = prompt('Nome da nova pasta:');
  if (!name?.trim()) return;
  await addDoc(foldersRef, { name: name.trim(), created: serverTimestamp() });
  toast('Pasta criada!','ok');
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NOTAS — renderizar cards
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/*
  Mapa de cores: índice (1-6) → hex da cor de fundo.
  Usado para aplicar tanto a classe CSS quanto o inline
  style no modal expandido.
*/
const COLOR_MAP = {
  1:'#fef9c3', 2:'#dbeafe', 3:'#dcfce7',
  4:'#ffedd5', 5:'#f3e8ff', 6:'#ffe4e6'
};
const TEXT_MAP = {
  1:'#1c1917', 2:'#0f172a', 3:'#052e16',
  4:'#1c0a00', 5:'#1e0635', 6:'#1c0a0a'
};

function renderNotes() {
  const G = document.getElementById('notesGrid');
  const E = document.getElementById('notesEmpty');
  G.innerHTML = '';

  const visible = activeFolder === 'all'
    ? allNotes
    : allNotes.filter(n => n.folder === activeFolder);

  if (!visible.length) { E.style.display = 'flex'; return; }
  E.style.display = 'none';

  visible.forEach((note, idx) => {
    const card = document.createElement('div');
    card.className = `note-card nc${note.color || 1}`;
    card.draggable = true;
    card.dataset.id  = note.id;
    card.dataset.idx = idx;

    /*
      Restaura tamanho salvo:
      width/height são strings CSS salvas no Firestore
      (ex: "340px", "280px"). Aplicamos inline para sobrescrever
      o tamanho padrão do grid.
    */
    if (note.width)  card.style.width  = note.width;
    if (note.height) card.style.height = note.height;

    // Opções de pasta para o <select> dentro do card
    const folderOpts = allFolders.map(f =>
      `<option value="${f.id}" ${note.folder === f.id ? 'selected':''}>📁 ${f.name}</option>`
    ).join('');

    card.innerHTML = `
      <div class="note-topbar">
        <div class="note-topbar-left">
          <span class="note-drag" title="Arrastar"><i class="fa-solid fa-grip-vertical"></i></span>
          <span class="cdot" style="background:#fef9c3" data-c="1"></span>
          <span class="cdot" style="background:#dbeafe" data-c="2"></span>
          <span class="cdot" style="background:#dcfce7" data-c="3"></span>
          <span class="cdot" style="background:#ffedd5" data-c="4"></span>
          <span class="cdot" style="background:#f3e8ff" data-c="5"></span>
          <span class="cdot" style="background:#ffe4e6" data-c="6"></span>
        </div>
        <div class="note-topbar-right">
          <button class="note-act-btn nexpand" title="Expandir">
            <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
          </button>
          <button class="note-act-btn danger ndel" title="Excluir">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>

      <!-- Título editável -->
      <div class="note-title-wrap">
        <input class="note-title-input" type="text"
               placeholder="Título da nota…"
               value="${(note.title || '').replace(/"/g,'&quot;')}"/>
      </div>

      <!-- Conteúdo -->
      <textarea class="note-body" placeholder="Escreva algo…">${note.content || ''}</textarea>

      <!-- Footer -->
      <div class="note-footer">
        <span class="note-ts">${fmtDate(note.createdAt || note.timestamp)}</span>
        <span class="note-chars">${(note.content||'').length} car.</span>
        <select class="note-folder-sel">
          <option value="">Sem pasta</option>
          ${folderOpts}
        </select>
      </div>`;

    /* ── Drag & Drop ── */
    card.addEventListener('dragstart', onDragStart);
    card.addEventListener('dragover',  onDragOver);
    card.addEventListener('drop',      onDrop);
    card.addEventListener('dragend',   onDragEnd);

    /*
      Redimensionamento via ResizeObserver:
      O browser aplica resize:both (CSS) ao card.
      O ResizeObserver detecta mudanças de tamanho causadas
      pelo handle nativo. Usamos debounce de 400ms para não
      salvar no Firestore a cada pixel arrastado.
    */
    const ro = new ResizeObserver(() => {
      clearTimeout(card._rt);
      card._rt = setTimeout(() => {
        const w = card.style.width;
        const h = card.style.height;
        if (w !== note.width || h !== note.height) {
          updateDoc(doc(db,'notes',note.id), { width: w, height: h });
          note.width = w; note.height = h;
        }
      }, 400);
    });
    ro.observe(card);

    /* ── Troca de cor ── */
    card.querySelectorAll('.cdot').forEach(d =>
      d.onclick = () => {
        const c = parseInt(d.dataset.c);
        updateDoc(doc(db,'notes',note.id), { color: c });
      }
    );

    /* ── Auto-save título (debounce 900ms) ── */
    /*
      Debounce: adiamos o salvamento para 900ms após o usuário
      parar de digitar. Isso evita uma escrita Firestore por tecla,
      reduzindo custo e latência.
    */
    const titleInput = card.querySelector('.note-title-input');
    let titleTimer;
    titleInput.oninput = () => {
      clearTimeout(titleTimer);
      titleTimer = setTimeout(() =>
        updateDoc(doc(db,'notes',note.id), { title: titleInput.value }), 900
      );
      // Sync com modal expandido se estiver aberto
      if (expandNoteId === note.id)
        document.getElementById('expTitle').value = titleInput.value;
    };

    /* ── Auto-save conteúdo (debounce 900ms) ── */
    const ta = card.querySelector('.note-body');
    const charEl = card.querySelector('.note-chars');
    let saveTimer;
    ta.oninput = () => {
      charEl.textContent = ta.value.length + ' car.';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() =>
        updateDoc(doc(db,'notes',note.id), { content: ta.value }), 900
      );
      if (expandNoteId === note.id) {
        document.getElementById('expBody').value = ta.value;
        document.getElementById('expChars').textContent = ta.value.length + ' car.';
      }
    };

    /* ── Excluir nota ── */
    card.querySelector('.ndel').onclick = async () => {
      if (confirm('Excluir nota?')) await deleteDoc(doc(db,'notes',note.id));
    };

    /* ── Mudar pasta ── */
    card.querySelector('.note-folder-sel').onchange = e =>
      updateDoc(doc(db,'notes',note.id), { folder: e.target.value });

    /* ── Expandir nota ── */
    card.querySelector('.nexpand').onclick = () => openExpandModal(note);

    G.appendChild(card);
  });

  renderFolderTabs();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MODAL EXPANDIR NOTA
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function openExpandModal(note) {
  expandNoteId = note.id;
  const overlay = document.getElementById('expandOverlay');
  const box     = document.getElementById('expandBox');
  const taExp   = document.getElementById('expBody');
  const titleExp = document.getElementById('expTitle');

  // Aplica cor da nota ao modal
  box.style.background = COLOR_MAP[note.color || 1];
  box.style.color      = TEXT_MAP[note.color || 1];

  titleExp.value = note.title || '';
  taExp.value    = note.content || '';
  document.getElementById('expTs').textContent    = fmtDate(note.createdAt || note.timestamp);
  document.getElementById('expChars').textContent = (note.content||'').length + ' car.';

  // Popula color dots no modal
  const dotsWrap = document.getElementById('expDots');
  dotsWrap.innerHTML = '';
  [1,2,3,4,5,6].forEach(c => {
    const d = document.createElement('span');
    d.className = 'cdot';
    d.style.background = COLOR_MAP[c];
    d.dataset.c = c;
    d.onclick = () => {
      updateDoc(doc(db,'notes',note.id), { color: c });
      box.style.background = COLOR_MAP[c];
      box.style.color      = TEXT_MAP[c];
      note.color = c;
    };
    dotsWrap.appendChild(d);
  });

  // Folder select
  const fsel = document.getElementById('expFolder');
  fsel.innerHTML = `<option value="">Sem pasta</option>`
    + allFolders.map(f =>
        `<option value="${f.id}" ${note.folder===f.id?'selected':''}>${f.name}</option>`
      ).join('');
  fsel.onchange = e => updateDoc(doc(db,'notes',note.id), { folder: e.target.value });

  // Auto-save no modal expandido (título)
  let expTitleTimer;
  titleExp.oninput = () => {
    clearTimeout(expTitleTimer);
    expTitleTimer = setTimeout(() => {
      updateDoc(doc(db,'notes',note.id), { title: titleExp.value });
      // Sync com o card se visível
      const card = document.querySelector(`.note-card[data-id="${note.id}"]`);
      if (card) {
        const inp = card.querySelector('.note-title-input');
        if (inp) inp.value = titleExp.value;
      }
    }, 900);
  };

  // Auto-save no modal expandido (conteúdo)
  let expSaveTimer;
  taExp.oninput = () => {
    document.getElementById('expChars').textContent = taExp.value.length + ' car.';
    clearTimeout(expSaveTimer);
    expSaveTimer = setTimeout(() => {
      updateDoc(doc(db,'notes',note.id), { content: taExp.value });
      const card = document.querySelector(`.note-card[data-id="${note.id}"]`);
      if (card) {
        const ta = card.querySelector('.note-body');
        const ch = card.querySelector('.note-chars');
        if (ta) ta.value = taExp.value;
        if (ch) ch.textContent = taExp.value.length + ' car.';
      }
    }, 900);
  };

  overlay.classList.add('open');
  taExp.focus();
}

function closeExpandModal() {
  document.getElementById('expandOverlay').classList.remove('open');
  expandNoteId = null;
}
document.getElementById('expandClose').onclick = closeExpandModal;
document.getElementById('expandOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('expandOverlay')) closeExpandModal();
});

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DRAG & DROP das notas
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let dragSrc = null;

function onDragStart(e) { this.classList.add('dragging'); dragSrc = this; e.dataTransfer.effectAllowed = 'move'; }
function onDragOver(e)  { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
function onDrop(e) {
  e.stopPropagation();
  if (dragSrc !== this) reorderNotes(dragSrc.dataset.id, this.dataset.id);
  return false;
}
function onDragEnd() { this.classList.remove('dragging'); }

/*
  Reordenar notas:
  1. Encontra índices de origem (si) e destino (ti) em allNotes.
  2. Remove do array e insere na nova posição (splice).
  3. Salva apenas o intervalo afetado (s→e) para minimizar escritas.
  4. Promise.all: executa todas as escritas em paralelo.
*/
async function reorderNotes(srcId, tgtId) {
  const si = allNotes.findIndex(n => n.id === srcId);
  const ti = allNotes.findIndex(n => n.id === tgtId);
  if (si < 0 || ti < 0) return;

  const arr = [...allNotes];
  const [rm] = arr.splice(si, 1);
  arr.splice(ti, 0, rm);

  const s = Math.min(si, ti), e = Math.max(si, ti);
  await Promise.all(
    Array.from({ length: e - s + 1 }, (_, i) =>
      updateDoc(doc(db,'notes',arr[s+i].id), { order: s+i })
    )
  );
}

/* ── Adicionar nova nota ── */
addNoteBtn.onclick = async () => {
  await addDoc(notesRef, {
    content:   '',
    title:     '',
    color:     Math.floor(Math.random() * 6) + 1,
    order:     allNotes.length,
    folder:    activeFolder === 'all' ? '' : activeFolder,
    createdAt: serverTimestamp(),
    timestamp: serverTimestamp()
  });
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HELPERS DE CONSOLE (utilitários globais)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/*
  Expor funções no window permite chamá-las no DevTools:
    importarLinksEmLote([{ title: "GitHub", url: "https://github.com", category: "Dev" }])
    removerDuplicatas()
*/
window.importarLinksEmLote = async arr => {
  let ok = 0, nok = 0;
  for (const l of arr) {
    if (allLinks.some(x => x.url.toLowerCase() === l.url.toLowerCase())) { nok++; continue; }
    try { await addDoc(linksRef, { ...l, timestamp: new Date() }); ok++; }
    catch { nok++; }
  }
  alert(`Importação: ✅ ${ok}  ❌ ${nok}`);
};

window.removerDuplicatas = async () => {
  const seen = new Set(); let n = 0;
  for (const l of allLinks) {
    if (seen.has(l.url)) { await deleteDoc(doc(db,'links',l.id)); n++; }
    else seen.add(l.url);
  }
  alert(`${n} duplicatas removidas.`);
};

/* ── Inicializa ── */
startLinks();
</script>
